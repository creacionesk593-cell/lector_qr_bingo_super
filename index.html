<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Cartones - TuBingo Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f5f6fa; margin:0; padding:0; text-align: center; color: #2c3e50; }
    .container { max-width: 480px; margin: 30px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    
    /* Logo Dinámico Secreto */
    .logo-click { max-width: 130px; cursor: pointer; user-select: none; margin-bottom: 10px; transition: transform 0.2s; }
    .logo-click:active { transform: scale(0.95); }
    
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #dcdde1; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    
    /* Botón dinámico controlado por base de datos */
    .btn-principal { width: 100%; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    
    .footer-texto { font-size: 0.8rem; color: #7f8c8d; margin-top: 25px; }
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2" defer></script>
  <script src="conexion.js" defer></script>
</head>
<body>

  <div class="container">
    <!-- Logotipo con redirección oculta (3 Clics) -->
    <img id="logoDinamico" class="logo-click" src="https://via.placeholder.com/150" alt="Bingo Logo">
    <h2 style="margin-top:0;">Registro de Cartones Oficial</h2>
    <p style="color:#7f8c8d; font-size:0.9rem; margin-top:-5px;">Valida tu código de canal y registra tu cartón</p>

    <div id="formularioBingo">
      <input type="text" id="regNombre" placeholder="Tu Nombre Completo">
      <input type="text" id="regTelefono" placeholder="Número de Celular">
      <input type="text" id="regCiudad" placeholder="Ciudad / Dirección">
      <input type="text" id="regCorreo" placeholder="Correo Electrónico">
      <input type="text" id="regCarton" placeholder="Código de Barra / Serie del Cartón">
      
      <!-- Validación Exigida en la conversación -->
      <input type="text" id="regCodigoCanal" placeholder="🔑 Código Secreto del Canal" style="border: 2px solid #3498db; text-transform: uppercase;">
      
      <button id="btnRegistrar" class="btn-principal" onclick="procesarRegistroCarton()">Registrar Mi Cartón</button>
    </div>

    <p class="footer-texto">&copy; 2026 TuBingo Pro. Operación local autorizada.</p>
  </div>

  <script>
    // 1. TRUCO SECRETO: Redirección al panel tras 3 clics en el logo
    let clicsLogo = 0;
    document.getElementById("logoDinamico").addEventListener("click", () => {
      clicsLogo++;
      if (clicsLogo === 3) { window.location.href = "panel.html"; }
      setTimeout(() => { clicsLogo = 0; }, 2000);
    });

    // 2. LEER E INYECTAR DISEÑO DINÁMICO DE MARCA AL CARGAR LA PÁGINA
    window.addEventListener("DOMContentLoaded", async () => {
      // Esperar brevemente a que conexion.js cargue _supabase
      setTimeout(async () => {
        try {
          const { data } = await _supabase.from('configuracion_sistema').select('clave, valor');
          if (data) {
            let logoUrl = data.find(x => x.clave === 'diseno_logo_url')?.valor;
            let colorPrimario = data.find(x => x.clave === 'diseno_color_principal')?.valor;

            if (logoUrl) document.getElementById("logoDinamico").src = logoUrl;
            if (colorPrimario) {
              document.getElementById("btnRegistrar").style.background = colorPrimario;
            }
          }
        } catch(e) { console.error("Error cargando personalización visual: ", e); }
      }, 600);
    });

    // 3. PROCESAR EL REGISTRO VALIDANDO EL CÓDIGO ACTUAL
    async function procesarRegistroCarton() {
      let nom = document.getElementById("regNombre").value.trim();
      let tel = document.getElementById("regTelefono").value.trim();
      let ciu = document.getElementById("regCiudad").value.trim();
      let cor = document.getElementById("regCorreo").value.trim();
      let car = document.getElementById("regCarton").value.trim().toUpperCase();
      let codIngresado = document.getElementById("regCodigoCanal").value.trim().toUpperCase();

      if (!nom || !tel || !car || !codIngresado) { alert("Por favor complete los campos obligatorios."); return; }

      try {
        // Consultar el código correcto activo en este segundo
        const { data: config } = await _supabase.from('configuracion_sistema').select('valor').eq('clave', 'codigo_canal_whatsapp').maybeSingle();
        
        if (!config || codIngresado !== config.valor.toUpperCase()) {
          alert("❌ El código del canal de WhatsApp es incorrecto o ya expiró. Revisa el canal e intenta de nuevo.");
          return;
        }

        // Insertar en la tabla registros_bingo
        const { error } = await _supabase.from('registros_bingo').insert({
          carton: car, nombre: nom, telefono: tel, ciudad: ciu, correo: cor
        });

        if (error) {
          if (error.code === '23505') alert("⚠️ Este número de cartón ya se encuentra registrado.");
          else throw error;
        } else {
          alert("🎉 ¡Excelente! Tu cartón ha sido registrado exitosamente para el sorteo.");
          document.getElementById("regCarton").value = "";
        }
      } catch(err) { alert("Error: " + err.message); }
    }
  </script>
</body>
</html>
