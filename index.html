<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Cartones - TuBingo Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background: #f9f9f9; color: #333; }
    header { background: #4CAF50; color: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .header-logo { max-height: 80px; max-width: 180px; object-fit: contain; display: none; } 
    header h2 { margin: 0; }
    main { padding: 20px; max-width: 600px; margin: auto; }
    #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 8px; overflow: hidden; background: #f0f0f0; border: 2px dashed #4CAF50; transition: border-color 0.3s ease; }
    #reader video { width: 100% !important; object-fit: cover; }
    .formulario { margin-top: 20px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .formulario h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }
    .formulario input { width: 100%; margin: 8px 0; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
    .formulario input:focus { outline: none; }
    .banner-alerta { background: #ff7675; color: white; padding: 12px; text-align: center; font-weight: bold; border-radius: 6px; margin-bottom: 15px; display: none; }
    .banner-cuenta-regresiva { background: #ff9f43; color: white; padding: 12px; text-align: center; font-weight: bold; border-radius: 6px; margin-bottom: 15px; display: none; animation: parpadeo 1.5s infinite; }
    @keyframes parpadeo { 0% { opacity: 0.9; } 50% { opacity: 1; background: #ee5253; } 100% { opacity: 0.9; } }
    button { width: 100%; padding: 14px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s, filter 0.2s; margin-top: 10px; }
    button:hover { filter: brightness(0.9); }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    .btn-pdf-diseno { display: block; text-align: center; background: #34495e; color: white; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
    .btn-pdf-diseno:hover { background: #2c3e50; }
    .table-container { width: 100%; overflow-x: auto; margin-top: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 12px 10px; text-align: center; }
    th { background: #4CAF50; color: white; }
    label { display: flex; align-items: center; margin: 10px 0; font-weight: 500; cursor: pointer; }
    label input[type="checkbox"] { margin-right: 10px; width: 18px; height: 18px; }
    #resultadoQR { margin-top: 15px; padding: 12px; background: #eef2f7; border-radius: 6px; text-align: center; font-size: 0.95rem; font-weight: bold; transition: all 0.3s ease; border: 1px solid transparent; }
    .scan-exito { background: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; transform: scale(1.02); }
    #contador { margin-top: 15px; font-size: 24px; color: #27ae60; font-weight: 800; text-align: center; background: #e8f5e9; padding: 10px; border-radius: 6px; border: 1px dashed #4CAF50; letter-spacing: 0.5px; transition: all 0.3s ease; }
    .loading { opacity: 0.5; pointer-events: none; position: relative; }
    .btn-eliminar { background: #ff7675; margin: 0; padding: 6px 12px; font-size: 13px; width: auto; border-radius: 4px; color: white; border: none; cursor: pointer; }
    .btn-eliminar:hover { background: #e84393; }
    .alerta-duplicado { color: #d63031; font-weight: bold; font-size: 12px; display: block; margin-top: 4px; }
    .fila-duplicada { background-color: #ffeaa7; } 
  </style>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="conexion.js"></script>
</head>
<body>
  <header id="headerRegistro">
    <img id="logoDinamico" class="header-logo" src="" alt="Bingo Logo">
    <h2 id="tituloHeader">Registro de Cartones - TuBingo Pro</h2>
  </header>
  
  <main id="contenidoPrincipal">
    <div id="bannerCierre" class="banner-alerta">⚠️ EL REGISTRO DE CARTONES YA ESTÁ CERRADO</div>
    <div id="bannerCuentaRegresiva" class="banner-cuenta-regresiva">⏳ EL REGISTRO CIERRA EN: <span id="tiempoRestante">00:00</span></div>

    <div class="formulario" style="margin-top:0;">
      <h3>Escanear Código QR</h3>
      <label><input type="checkbox" id="leerTodos" checked> Permitir múltiples cartones</label>
      <div id="reader"></div>
      <div id="resultadoQR">Esperando acción o escaneo...</div>

      <div style="margin-top:15px; border-top: 1px dashed #ccc; padding-top:15px;">
        <label style="font-weight: bold; margin-bottom: 5px; color:#34495e;">📄 ¿Tienes tus cartones en PDF Plano?</label>
        <label for="inputSubirPdf" class="btn-pdf-diseno">📂 Seleccionar y Procesar Archivo PDF</label>
        <input type="file" id="inputSubirPdf" accept=".pdf" style="display:none;" onchange="procesarCartonesDesdePdf(this)">
      </div>
      
      <div id="contador">Cartones en lista: 0</div>
    </div>

    <div class="formulario">
      <h3>Datos personales</h3>
      <input type="text" id="nombre" placeholder="Nombre Completo" required>
      <input type="text" id="celular" placeholder="Número de Celular" required>
      <input type="text" id="correo" placeholder="Correo Electrónico" required>
      <input type="text" id="ciudad" placeholder="Ciudad (Ej: Guayaquil)" required>
      <input type="text" id="direccion" placeholder="Dirección Exacta (Ej: Isla Trinitaria solar 45)" required>
      <input type="text" id="vendedor" placeholder="Nombre del Vendedor (Opcional)">
      
      <div style="margin-top: 15px; border-top: 1px solid #edf2f7; padding-top: 10px;">
        <label for="codigoCanal" style="font-weight: bold; color: #e67e22;">🔑 Código Secreto del Canal de WhatsApp:</label>
        <input type="text" id="codigoCanal" placeholder="Escribe la clave fijada en nuestro canal" required style="border: 2px solid #e67e22; text-transform: uppercase; font-weight: bold;">
      </div>

      <button id="btnRegistrar" onclick="enviarAlBackend()">Registrar Cartones en el Sistema</button>
    </div>

    <div class="table-container">
      <table id="tabla">
        <thead>
          <tr>
            <th class="dinamico-th">#</th>
            <th class="dinamico-th">Serie (Cartón)</th>
            <th class="dinamico-th">Ubicación</th>
            <th class="dinamico-th">Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4" style="color:#999; padding: 15px;">Ningún cartón escaneado aún</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <canvas id="canvasPdfRender" style="display:none;"></canvas>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let CONFIG_SISTEMA = { limite_cartones: 5, fecha_cierre: null, caracteres_qr: 6 };
    let listaQR = [];
    let cartonesDuplicados = []; 
    let ipPublica = "", geoLatitud = "", geoLongitud = "";
    let intervaloRegresivo = null;

    function emitirSonidoExito() {
      try {
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let oscillator = audioCtx.createOscillator();
        let gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.12); 
      } catch (e) { console.error(e); }
    }

    window.addEventListener('load', async () => {
      fetch('https://api.ipify.org?format=json').then(res => res.json()).then(d => ipPublica = d.ip).catch(e => {});
      setTimeout(async () => {
        try {
          const { data: configGeneral } = await _supabase.from('configuracion').select('*').eq('id', 1).single();
          if (configGeneral) {
            CONFIG_SISTEMA.limite_cartones = configGeneral.limite_cartones;
            CONFIG_SISTEMA.caracteres_qr = configGeneral.caracteres_qr;
            CONFIG_SISTEMA.fecha_cierre = new Date(configGeneral.fecha_cierre);
          }
        } catch (err) { console.error(err); }
      }, 500);
    });

    function actualizarContador() {
      document.getElementById("contador").innerText = "Cartones en lista: " + listaQR.length;
    }

    function procesarFormato(texto) {
      let formato = CONFIG_SISTEMA.caracteres_qr;
      let pos = texto.indexOf("@");
      if (pos !== -1 && texto.length > pos + formato) {
        return texto.substring(pos+1, pos+1+formato);
      }
      return texto.length > formato ? texto.substring(texto.length - formato) : texto;
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: 250 });
    html5QrcodeScanner.render((txt) => {
      let limpio = procesarFormato(txt);
      if (!listaQR.includes(limpio)) {
        emitirSonidoExito();
        listaQR.push(limpio);
        actualizarTabla();
      }
    }, (err) => {});

    /* =========================================================================
       NUEVO MOTOR ESCÁNER DE IMÁGENES PLANAS DENTRO DE PDF (MÁXIMA RESISTENCIA)
       ========================================================================= */
    async function procesarCartonesDesdePdf(input) {
      let archivo = input.files[0];
      if (!archivo) return;

      let contenedorResultado = document.getElementById("resultadoQR");
      let mainEl = document.getElementById("contenidoPrincipal");
      mainEl.classList.add("loading");
      contenedorResultado.innerText = "📸 Extrayendo y limpiando imágenes planas del archivo...";

      try {
        let arrayBuffer = await archivo.arrayBuffer();
        let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let totalPaginas = pdf.numPages;
        let encontrados = 0;

        let canvas = document.getElementById("canvasPdfRender");
        let ctx = canvas.getContext("2d", { willReadFrequently: true });

        // Instanciamos el lector alternativo de soporte directo
        const html5QrCode = new Html5QrCode("canvasPdfRender");

        for (let p = 1; p <= totalPaginas; p++) {
          contenedorResultado.innerText = `Procesando imagen de la página ${p} de ${totalPaginas}...`;
          let pagina = await pdf.getPage(p);
          
          // Escalado crítico a 4.0x para forzar la reconstrucción de los píxeles del QR plano borroso
          let vista = pagina.getViewport({ scale: 4.0 });
          canvas.width = vista.width;
          canvas.height = vista.height;
          
          await pagina.render({ canvasContext: ctx, viewport: vista }).promise;

          // Filtro Gráfico: Umbralización adaptativa para remover el "ruido" de la imagen del bingo
          let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          let d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            let luminosidad = 0.2126 * d[i] + 0.7152 * d[i+1] + 0.0722 * d[i+2];
            // Si el pixel tiende a oscuro lo convertimos en negro sólido, si es claro en blanco puro
            let colorLimpio = luminosidad < 128 ? 0 : 255;
            d[i] = d[i+1] = d[i+2] = colorLimpio;
          }
          ctx.putImageData(imgData, 0, 0);

          // Intentamos la decodificación usando jsQR sobre la matriz binarizada limpia
          let escaneo = jsQR(d, canvas.width, canvas.height, {
            inversionAttempts: "dontInvert"
          });

          if (escaneo && escaneo.data) {
            let limpio = procesarFormato(escaneo.data);
            if (!listaQR.includes(limpio)) {
              listaQR.push(limpio);
              encontrados++;
            }
          }
        }

        if (encontrados > 0) {
          emitirSonidoExito();
          contenedorResultado.innerText = `🎉 ¡Listo! Se leyeron ${encontrados} códigos QR desde las imágenes planas del PDF.`;
          contenedorResultado.classList.add("scan-exito");
          setTimeout(() => { contenedorResultado.classList.remove("scan-exito"); }, 2000);
          actualizarTabla();
        } else {
          alert("⚠️ No se detectó la matriz de píxeles del QR.\n\nPrueba tomando una captura con más brillo o limpia la cámara si los cartones provienen de fotos de celulares.");
        }

      } catch (err) { 
        alert("Error procesando imagen plana: " + err.message); 
      } finally { 
        mainEl.classList.remove("loading"); 
        input.value = ""; 
      }
    }

    function actualizarTabla() {
      let tbody = document.querySelector("#tabla tbody");
      tbody.innerHTML = "";
      let ciudad = document.getElementById("ciudad").value.trim() || "---";
      let direccion = document.getElementById("direccion").value.trim() || "---";

      if (listaQR.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="color:#999; padding: 15px;">Ningún cartón escaneado aún</td></tr>`;
        actualizarContador(); return;
      }
      listaQR.forEach((qr, idx) => {
        let fila = document.createElement("tr");
        if (cartonesDuplicados.includes(qr)) fila.classList.add("fila-duplicada");
        fila.innerHTML = `<td>${idx + 1}</td><td><strong>${qr}</strong></td><td>${ciudad} - ${direccion}</td><td><button class="btn-eliminar" onclick="eliminarCarton(${idx})">Eliminar</button></td>`;
        tbody.appendChild(fila);
      });
      actualizarContador();
    }

    function eliminarCarton(idx) {
      listaQR.splice(idx, 1); actualizarTabla();
    }

    async function enviarAlBackend() {
      let nombre = document.getElementById("nombre").value.trim();
      let celular = document.getElementById("celular").value.trim();
      let correo = document.getElementById("correo").value.trim();
      let ciudad = document.getElementById("ciudad").value.trim();
      let direccion = document.getElementById("direccion").value.trim();
      let codigoIngresado = document.getElementById("codigoCanal").value.trim().toUpperCase();

      if (!nombre || !celular || !correo || !ciudad || !direccion || !codigoIngresado || listaQR.length === 0) {
        alert("Por favor rellene todos los campos requeridos."); return;
      }
      let mainEl = document.getElementById("contenidoPrincipal");
      mainEl.classList.add("loading");

      try {
        const { data: configCanal } = await _supabase.from('configuracion_sistema').select('valor').eq('clave', 'codigo_canal_whatsapp').maybeSingle();
        if (!configCanal || codigoIngresado !== configCanal.valor.toUpperCase()) {
          alert("❌ Código secreto incorrecto."); return;
        }
        let ubicacionCompleta = `${ciudad} - ${direccion}`;
        let filas = listaQR.map(serie => ({ carton: serie, nombre: nombre, correo: correo, telefono: celular, ciudad: ubicacionCompleta, vendedor: "WEB", ip_publica: ipPublica }));
        const { error } = await _supabase.from('registros_bingo').insert(filas);
        if (error) throw error;
        alert("¡Todos los cartones se guardaron correctamente!");
        listaQR = []; actualizarTabla();
      } catch (e) { alert(e.message); } 
      finally { mainEl.classList.remove("loading"); }
    }
  </script>
</body>
</html>
